<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Nexus | Premium Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f7fb; }
        
        .navbar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #06b6d4, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { cursor: pointer; text-decoration: none; color: #334155; font-weight: 500; }
        .lang-btn { background: #e2e8f0; border: none; padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        .hero { text-align: center; padding: 3rem 0; }
        .hero h1 { font-size: 3rem; background: linear-gradient(135deg, #0f172a, #06b6d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 2rem; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #06b6d4; color: white; }
        .btn-outline { background: transparent; border: 2px solid #06b6d4; color: #06b6d4; }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .card { background: white; padding: 1.5rem; border-radius: 1rem; cursor: pointer; transition: all 0.2s; border: 1px solid #e2e8f0; }
        .card:hover { transform: translateY(-4px); border-color: #06b6d4; box-shadow: 0 12px 24px -12px rgba(6,182,212,0.2); }
        
        .tabs { display: flex; gap: 1rem; margin: 2rem 0 1rem; }
        .tab { padding: 0.5rem 1.5rem; border-radius: 2rem; cursor: pointer; background: #e2e8f0; }
        .tab.active { background: #06b6d4; color: white; }
        
        .notes-content { background: white; padding: 2rem; border-radius: 1rem; line-height: 1.6; }
        .notes-content h2 { margin: 1rem 0 0.5rem; }
        .notes-content pre { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        
        .locked-wrapper { position: relative; max-height: 400px; overflow: hidden; }
        .locked-wrapper::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 150px; background: linear-gradient(to bottom, transparent, white); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 2rem; border-radius: 1rem; max-width: 400px; width: 90%; }
        .modal-content input { width: 100%; padding: 0.75rem; margin: 0.5rem 0; border: 1px solid #e2e8f0; border-radius: 0.5rem; }
        
        .back-btn { background: none; border: none; color: #06b6d4; cursor: pointer; margin-bottom: 1rem; font-weight: 500; }
        
        @media (max-width: 768px) {
            .navbar { padding: 0.75rem 1rem; }
            .nav-links { display: none; }
            .container { padding: 1rem; }
            .hero h1 { font-size: 1.8rem; }
            .card-grid { grid-template-columns: 1fr; }
        }
        
        footer { text-align: center; padding: 2rem; color: #64748b; border-top: 1px solid #e2e8f0; margin-top: 3rem; }
    </style>
</head>
<body>

<div id="app">Loading...</div>

<div id="unlockModal" class="modal">
    <div class="modal-content">
        <h3>🔓 Unlock Full Notes</h3>
        <input type="text" id="unlockName" placeholder="Full Name">
        <input type="tel" id="unlockMobile" placeholder="Mobile Number">
        <button class="btn btn-primary" id="submitUnlock" style="width:100%; margin-top:0.5rem;">Unlock Now</button>
        <button id="closeModal" style="margin-top:0.5rem; width:100%; background:#e2e8f0; border:none; padding:0.5rem; border-radius:2rem;">Cancel</button>
    </div>
</div>

<script>
    // ========== YAHAN APNA SUPABASE URL DAALO ==========
    const SUPABASE_URL = "https://rsnywjwcltuicfisqkdo.supabase.co";  // CHANGE KARO
    const SUPABASE_ANON_KEY = "sb_publishable_86Crft4pqsX_ubUwnSdX6A_9fPl4T2M";  // CHANGE KARO
    
    let supabase;
    let currentLang = "english";
    let currentPage = "home";
    let currentSemester = null;
    let currentSubject = null;
    let currentUnit = null;
    let currentSubjectName = "";
    let semestersList = [];
    let subjectsList = {};
    let unitsList = {};
    let unlockedNotes = JSON.parse(localStorage.getItem("unlockedNotes") || "{}");
    let currentNoteData = null;
    
    // Initialize Supabase
    async function initSupabase() {
        if (SUPABASE_URL === "https://YOUR_PROJECT.supabase.co") {
            document.getElementById("app").innerHTML = `
                <div style="text-align:center; padding:3rem;">
                    <h2>⚠️ Supabase Configuration Required</h2>
                    <p>Please set SUPABASE_URL and SUPABASE_ANON_KEY in the code.</p>
                    <code style="background:#f1f5f9; padding:0.5rem; display:inline-block; margin-top:1rem;">
                        const SUPABASE_URL = "https://your-project.supabase.co";<br>
                        const SUPABASE_ANON_KEY = "your-anon-key";
                    </code>
                </div>
            `;
            return false;
        }
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await loadData();
        render();
        return true;
    }
    
    async function loadData() {
        // Load semesters
        const { data: semesters } = await supabase.from("semesters").select("*").order("id");
        semestersList = semesters || [];
        
        // Load subjects
        const { data: subjects } = await supabase.from("subjects").select("*");
        subjectsList = {};
        if (subjects) {
            subjects.forEach(s => {
                if (!subjectsList[s.semester_id]) subjectsList[s.semester_id] = [];
                subjectsList[s.semester_id].push(s);
            });
        }
        
        // Load units
        const { data: units } = await supabase.from("units").select("*");
        unitsList = {};
        if (units) {
            units.forEach(u => {
                if (!unitsList[u.subject_id]) unitsList[u.subject_id] = [];
                unitsList[u.subject_id].push(u);
            });
        }
    }
    
    async function loadNote(unitId) {
        const { data } = await supabase.from("notes").select("*").eq("unit_id", unitId).maybeSingle();
        currentNoteData = data;
        return data;
    }
    
    async function loadPYQs(unitId) {
        const { data } = await supabase.from("pyqs").select("*").eq("unit_id", unitId);
        return data || [];
    }
    
    async function loadImpQuestions(unitId) {
        const { data } = await supabase.from("important_questions").select("*").eq("unit_id", unitId);
        return data || [];
    }
    
    async function saveLead(name, mobile) {
        await supabase.from("leads").insert([{ name, mobile, created_at: new Date() }]);
    }
    
    function showUnlockModal(noteId, callback) {
        const modal = document.getElementById("unlockModal");
        modal.style.display = "flex";
        document.getElementById("submitUnlock").onclick = async () => {
            const name = document.getElementById("unlockName").value;
            const mobile = document.getElementById("unlockMobile").value;
            if (!name || !mobile) { alert("Please fill all fields"); return; }
            await saveLead(name, mobile);
            unlockedNotes[noteId] = true;
            localStorage.setItem("unlockedNotes", JSON.stringify(unlockedNotes));
            modal.style.display = "none";
            document.getElementById("unlockName").value = "";
            document.getElementById("unlockMobile").value = "";
            if (callback) callback();
            render();
        };
        document.getElementById("closeModal").onclick = () => { modal.style.display = "none"; };
    }
    
    function navigateTo(page, params = {}) {
        currentPage = page;
        if (params.semester) currentSemester = params.semester;
        if (params.subject) { currentSubject = params.subject; currentSubjectName = params.subjectName; }
        if (params.unit) currentUnit = params.unit;
        render();
    }
    
    function goBack() {
        if (currentPage === "subject") { currentPage = "semester"; currentSubject = null; }
        else if (currentPage === "unit") { currentPage = "subject"; currentUnit = null; }
        else if (currentPage === "notes") { currentPage = "unit"; }
        else { currentPage = "home"; currentSemester = null; currentSubject = null; currentUnit = null; }
        render();
    }
    
    async function render() {
        let content = "";
        
        if (currentPage === "home") {
            content = `
                <div class="hero">
                    <h1>📘 Your Complete BCA<br>Learning Platform</h1>
                    <p style="margin: 1rem 0; color:#64748b;">Notes • PYQs • Important Questions</p>
                    <div style="display:flex; gap:1rem; justify-content:center;">
                        <button class="btn btn-primary" onclick="navigateTo('semester', {semester:${semestersList[0]?.id || 1}})">Start Learning</button>
                        <button class="btn btn-outline" onclick="navigateTo('semester', {semester:${semestersList[0]?.id || 1}})">Browse Notes</button>
                    </div>
                </div>
                <h2 style="margin-top:2rem;">📚 All Semesters</h2>
                <div class="card-grid">
                    ${semestersList.map(s => `
                        <div class="card" onclick="navigateTo('semester', {semester:${s.id}})">
                            <h3>Semester ${s.name}</h3>
                            <p style="color:#64748b; font-size:0.85rem;">${subjectsList[s.id]?.length || 0} Subjects</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        else if (currentPage === "semester") {
            const subjects = subjectsList[currentSemester] || [];
            content = `
                <button class="back-btn" onclick="goBack()">← Back</button>
                <h2>Semester ${semestersList.find(s=>s.id==currentSemester)?.name || currentSemester}</h2>
                <div class="card-grid">
                    ${subjects.map(s => `
                        <div class="card" onclick="navigateTo('subject', {semester:${currentSemester}, subject:${s.id}, subjectName:'${s.name}'})">
                            <h3>${s.name}</h3>
                            <p style="color:#64748b;">${unitsList[s.id]?.length || 0} Units</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        else if (currentPage === "subject") {
            const units = unitsList[currentSubject] || [];
            content = `
                <button class="back-btn" onclick="goBack()">← Back</button>
                <h2>${currentSubjectName}</h2>
                <div class="card-grid">
                    ${units.map(u => `
                        <div class="card" onclick="navigateTo('unit', {semester:${currentSemester}, subject:${currentSubject}, unit:${u.id}})">
                            <h3>${u.name}</h3>
                            <p style="color:#64748b;">Notes + PYQs + Imp Qs</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        else if (currentPage === "unit") {
            const note = await loadNote(currentUnit);
            const isUnlocked = unlockedNotes[`note_${currentUnit}`];
            const contentField = currentLang === "english" ? "english_content" : "hindi_content";
            const noteContent = note?.[contentField] || note?.english_content || "<p>No content available</p>";
            const previewContent = note?.preview_content || noteContent.substring(0, 300);
            
            content = `
                <button class="back-btn" onclick="goBack()">← Back</button>
                <h2>Unit Content</h2>
                <div class="tabs">
                    <div class="tab active" onclick="showTabContent('notes')">📄 Notes</div>
                    <div class="tab" onclick="showTabContent('pyq')">📜 PYQs</div>
                    <div class="tab" onclick="showTabContent('imp')">⭐ Important Qs</div>
                </div>
                <div id="tabContent"></div>
            `;
            
            document.getElementById("app").innerHTML = getNavbar() + `<div class="container">${content}</div>` + getFooter();
            
            window.showTabContent = async (tab) => {
                const tabDiv = document.getElementById("tabContent");
                document.querySelectorAll('.tab').forEach((t,i)=>{ t.classList.remove('active'); });
                event.target.classList.add('active');
                
                if (tab === 'notes') {
                    if (!isUnlocked && noteContent && noteContent.length > 300) {
                        tabDiv.innerHTML = `
                            <div class="locked-wrapper"><div class="notes-content">${previewContent}...</div></div>
                            <button class="btn btn-primary" style="display:block; margin:1rem auto;" onclick="showUnlockModal('note_${currentUnit}', () => location.reload())">🔓 Unlock Full Notes</button>
                        `;
                    } else {
                        tabDiv.innerHTML = `<div class="notes-content">${noteContent}</div>`;
                    }
                } else if (tab === 'pyq') {
                    const pyqs = await loadPYQs(currentUnit);
                    tabDiv.innerHTML = `<div class="notes-content">
                        ${pyqs.map(p => `
                            <details style="margin-bottom:1rem; padding:0.5rem; border-bottom:1px solid #e2e8f0;">
                                <summary style="font-weight:600;">📅 ${p.year} - ${p.question}</summary>
                                <p style="margin-top:0.5rem;">${p.answer || "Answer coming soon"}</p>
                            </details>
                        `).join('')}
                        ${pyqs.length === 0 ? "<p>No PYQs available yet.</p>" : ""}
                    </div>`;
                } else if (tab === 'imp') {
                    const impQs = await loadImpQuestions(currentUnit);
                    tabDiv.innerHTML = `<div class="notes-content">
                        ${impQs.map(q => `
                            <div style="margin-bottom:1rem; padding:1rem; background:#f8fafc; border-radius:0.5rem;">
                                <span style="background:#06b6d4; color:white; padding:0.2rem 0.6rem; border-radius:1rem; font-size:0.7rem;">${q.category}</span>
                                <p style="margin:0.5rem 0; font-weight:500;">❓ ${q.question}</p>
                                <details><summary style="color:#06b6d4;">View Answer</summary><p style="margin-top:0.5rem;">${q.answer || "Answer not available"}</p></details>
                            </div>
                        `).join('')}
                        ${impQs.length === 0 ? "<p>No important questions yet.</p>" : ""}
                    </div>`;
                }
            };
            setTimeout(() => window.showTabContent('notes'), 50);
            return;
        }
        
        document.getElementById("app").innerHTML = getNavbar() + `<div class="container">${content}</div>` + getFooter();
    }
    
    function getNavbar() {
        return `
            <div class="navbar">
                <div class="logo" onclick="navigateTo('home')">📘 BCA Nexus</div>
                <div class="nav-links">
                    <a onclick="navigateTo('home')">Home</a>
                    <a onclick="navigateTo('semester', {semester:${semestersList[0]?.id || 1}})">Semesters</a>
                    <a>Notes</a>
                    <a>PYQs</a>
                    <button class="lang-btn" onclick="toggleLang()">${currentLang === 'english' ? 'हिंदी' : 'English'}</button>
                </div>
            </div>
        `;
    }
    
    function getFooter() {
        return `<footer>© 2025 BCA Nexus — Premium Learning Platform</footer>`;
    }
    
    function toggleLang() {
        currentLang = currentLang === "english" ? "hindi" : "english";
        localStorage.setItem("prefLang", currentLang);
        render();
    }
    
    // Make functions global
    window.navigateTo = navigateTo;
    window.goBack = goBack;
    window.toggleLang = toggleLang;
    window.showUnlockModal = showUnlockModal;
    
    // Start
    initSupabase();
</script>
</body>
</html>
