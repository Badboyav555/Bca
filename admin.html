<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Admin | Content Manager</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --sidebar-bg: #1e1e1e;
            --sidebar-text: #a1a1aa;
            --sidebar-active: #27272a;
            --sidebar-active-text: #fafafa;
            --primary: #06b6d4;
            --danger: #ef4444;
            --bg-body: #f3f4f6;
            --card-bg: #ffffff;
            --border: #e5e7eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 240px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; border-right: 1px solid #333; }
        .brand { padding: 20px; color: white; font-weight: 600; font-size: 1.1rem; border-bottom: 1px solid #333; }
        .nav-items { flex: 1; padding: 10px; overflow-y: auto; }
        .nav-item { padding: 10px 14px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; margin-bottom: 4px; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--sidebar-active); color: var(--sidebar-active-text); }
        
        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .top-bar { background: var(--card-bg); height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        .content-area { padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

        /* Components */
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: white; border: 1px solid var(--border); }
        
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; font-family: inherit; }
        textarea { min-height: 200px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: #6b7280; font-weight: 500; }
        
        .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; background: #e0f2fe; color: #0284c7; }
        .demo-banner { background: #f59e0b; color: white; text-align: center; padding: 4px; font-size: 0.8rem; font-weight: 600; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -240px; height: 100%; z-index: 50; transition: left 0.3s; }
            .sidebar.open { left: 0; }
            .mobile-toggle { display: block; }
        }
    </style>
</head>
<body>

    <!-- Demo Banner -->
    <div class="demo-banner" id="demoBanner">DEMO MODE - Data not saved</div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="brand"><i class="ri-dashboard-3-line"></i> BCA Admin</div>
        <div class="nav-items">
            <div class="nav-item active" onclick="loadView('dashboard')"><i class="ri-home-line"></i> Dashboard</div>
            <div class="nav-item" onclick="loadView('subjects')"><i class="ri-book-2-line"></i> Subjects</div>
            <div class="nav-item" onclick="loadView('units')"><i class="ri-file-list-line"></i> Units</div>
            <div class="nav-item" onclick="loadView('notes')"><i class="ri-article-line"></i> Notes</div>
            <div class="nav-item" onclick="loadView('pyqs')"><i class="ri-question-answer-line"></i> PYQs</div>
        </div>
        <div style="padding: 20px; border-top: 1px solid #333;">
            <a href="index.html" class="btn btn-outline" style="width:100%; justify-content:center; color:white; border-color:#444;">Back to Site</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <button class="btn btn-outline" onclick="toggleSidebar()" style="display:none;" id="menuBtn"><i class="ri-menu-line"></i></button>
            <h3 id="pageTitle">Dashboard</h3>
            <div class="user-profile" style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:0.9rem;">Admin</span>
                <div style="width:32px; height:32px; background:var(--primary); border-radius:50%; color:white; display:flex; align-items:center; justify-content:center;">A</div>
            </div>
        </div>
        
        <div class="content-area" id="viewContainer">
            <!-- Dynamic Content Loads Here -->
        </div>
    </div>

    <script>
        // CONFIGURATION
        const SUPABASE_URL = "https://gblftqjshhukrcwukjfw.supabase.co"; // MATCHES INDEX
        const SUPABASE_KEY = "sb_publishable_Mz2N6p-1qE5ZeNDMhDbgVA_cesNd4Pf"; // MATCHES INDEX
        
        let supabase = null;
        let isDemoMode = false;
        
        if (SUPABASE_URL && SUPABASE_KEY) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else {
            isDemoMode = true;
            document.getElementById('demoBanner').style.display = 'block';
        }

        // MOCK DATA STORE (For Demo Mode Persistence in Memory)
        let store = {
            subjects: [
                { id: 1, name: "Programming in C", semester_id: 1 },
                { id: 2, name: "Mathematics I", semester_id: 1 }
            ],
            units: [
                { id: 101, subject_id: 1, name: "Introduction to C" }
            ],
            notes: [
                { id: 1001, unit_id: 101, title: "Unit 1 Notes", english_content: "<p>C Content...</p>" }
            ]
        };

        // VIEWS
        const views = {
            dashboard: () => `
                <div class="grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:20px; margin-bottom:24px;">
                    <div class="card"><h3>Total Subjects</h3><p style="font-size:2rem; font-weight:700; color:var(--primary);">${store.subjects.length}</p></div>
                    <div class="card"><h3>Total Units</h3><p style="font-size:2rem; font-weight:700; color:var(--primary);">${store.units.length}</p></div>
                    <div class="card"><h3>Total Notes</h3><p style="font-size:2rem; font-weight:700; color:var(--primary);">${store.notes.length}</p></div>
                </div>
                <div class="card">
                    <h3>Recent Activity</h3>
                    <p class="text-muted">System operational. Demo mode active.</p>
                </div>
            `,
            subjects: () => `
                <div class="flex justify-between items-center mb-4">
                    <h4>Manage Subjects</h4>
                    <button class="btn btn-primary" onclick="openModal('subject')">+ Add Subject</button>
                </div>
                <div class="card">
                    <table>
                        <thead><tr><th>ID</th><th>Name</th><th>Semester ID</th><th>Action</th></tr></thead>
                        <tbody>
                            ${store.subjects.map(s => `
                                <tr>
                                    <td>${s.id}</td>
                                    <td>${s.name}</td>
                                    <td>${s.semester_id}</td>
                                    <td><button class="btn btn-danger btn-sm" onclick="deleteItem('subjects', ${s.id})">Delete</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `,
            notes: () => `
                <div class="flex justify-between items-center mb-4">
                    <h4>Manage Notes</h4>
                    <button class="btn btn-primary" onclick="openModal('note')">+ Add Note</button>
                </div>
                <div class="card">
                    <table>
                        <thead><tr><th>ID</th><th>Title</th><th>Unit ID</th><th>Action</th></tr></thead>
                        <tbody>
                            ${store.notes.map(n => `
                                <tr>
                                    <td>${n.id}</td>
                                    <td>${n.title}</td>
                                    <td>${n.unit_id}</td>
                                    <td><button class="btn btn-danger btn-sm" onclick="deleteItem('notes', ${n.id})">Delete</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `,
            units: () => `<div class="card"><p>Units Management (Similar to Subjects)</p></div>`,
            pyqs: () => `<div class="card"><p>PYQs Management (Similar structure)</p></div>`
        };

        // RENDER LOGIC
        function loadView(viewName) {
            // Update Sidebar
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active'); // Simple highlight logic
            
            // Update Title
            document.getElementById('pageTitle').innerText = viewName.charAt(0).toUpperCase() + viewName.slice(1);
            
            // Render Content
            document.getElementById('viewContainer').innerHTML = views[viewName]();
        }

        // DATA OPERATIONS
        function openModal(type) {
            const title = prompt(`Enter ${type} Name/Title:`);
            if (title) {
                const id = Math.floor(Math.random() * 10000);
                if (type === 'subject') {
                    store.subjects.push({ id, name: title, semester_id: 1 });
                    loadView('subjects');
                } else if (type === 'note') {
                    store.notes.push({ id, title: title, unit_id: 101, english_content: "<p>New content...</p>" });
                    loadView('notes');
                }
            }
        }

        function deleteItem(collection, id) {
            if(confirm('Are you sure?')) {
                store[collection] = store[collection].filter(i => i.id !== id);
                // Refresh current view (naive implementation)
                const activeNav = document.querySelector('.nav-item.active').innerText.toLowerCase();
                if(activeNav.includes('subject')) loadView('subjects');
                if(activeNav.includes('note')) loadView('notes');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('viewContainer').innerHTML = views.dashboard();
            
            // Check mobile for menu button
            if(window.innerWidth <= 768) {
                document.getElementById('menuBtn').style.display = 'block';
            }
        });

    </script>
</body>
</html>
