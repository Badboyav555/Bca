<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCA Premium Notes Platform</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================
           RESET & VARIABLES
           ========================================= */
        :root {
            --primary: #06b6d4; /* Cyan */
            --primary-hover: #0891b2;
            --dark: #0f172a;
            --text: #334155;
            --text-light: #64748b;
            --bg: #ffffff;
            --surface: #f8fafc;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-glow: 0 0 20px rgba(6, 182, 212, 0.15);
            --radius: 12px;
            --font-main: 'Inter', sans-serif;
            --font-head: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 80px; /* Space for mobile nav if needed */
        }

        a { text-decoration: none; color: inherit; transition: 0.2s; }
        ul { list-style: none; }
        button, input, textarea { font-family: inherit; outline: none; border: none; }
        
        /* =========================================
           UTILITIES & TYPOGRAPHY
           ========================================= */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 8px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
        .text-center { text-align: center; }
        .text-primary { color: var(--primary); }
        .font-bold { font-weight: 600; }
        .w-full { width: 100%; }
        
        h1, h2, h3, h4 { font-family: var(--font-head); color: var(--dark); line-height: 1.2; }
        
        /* =========================================
           COMPONENTS
           ========================================= */
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-ghost { background: transparent; color: var(--text); }
        .btn-ghost:hover { background: var(--surface); }
        .btn-sm { padding: 6px 12px; font-size: 0.85rem; }

        /* Cards */
        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md), var(--shadow-glow);
            transform: translateY(-2px);
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--surface);
            color: var(--text-light);
        }
        .badge.active { background: #cffafe; color: var(--primary); }

        /* Inputs */
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-label { display: block; font-size: 0.85rem; color: var(--text-light); margin-bottom: 6px; }
        .input-field {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .input-field:focus { border-color: var(--primary); background: white; }

        /* =========================================
           LAYOUT ELEMENTS
           ========================================= */
        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            height: 60px;
            display: flex;
            align-items: center;
        }
        .nav-logo { font-weight: 700; font-size: 1.25rem; color: var(--dark); display: flex; align-items: center; gap: 8px; }
        .nav-logo span { color: var(--primary); }
        .nav-links { display: none; gap: 24px; }
        .nav-link { font-size: 0.95rem; font-weight: 500; color: var(--text-light); cursor: pointer; }
        .nav-link:hover, .nav-link.active { color: var(--primary); }

        /* Hero */
        .hero {
            padding: 60px 0 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
        }
        .hero h1 { font-size: 2rem; margin-bottom: 12px; letter-spacing: -1px; }
        .hero p { color: var(--text-light); font-size: 1rem; margin-bottom: 24px; }
        
        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        /* Breadcrumbs */
        .breadcrumbs { display: flex; gap: 8px; font-size: 0.85rem; color: var(--text-light); margin-bottom: 24px; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; }
        .crumb { cursor: pointer; }
        .crumb:hover { color: var(--primary); }
        .crumb span { color: var(--border); }

        /* Notes Reader */
        .reader-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
        }
        @media (min-width: 900px) {
            .reader-container { grid-template-columns: 240px 1fr; }
        }
        
        .toc-sticky { position: sticky; top: 80px; }
        .toc-list { font-size: 0.9rem; }
        .toc-item { display: block; padding: 6px 0; color: var(--text-light); cursor: pointer; border-left: 2px solid transparent; padding-left: 12px; }
        .toc-item:hover { color: var(--primary); border-color: var(--primary); }

        .note-content { font-size: 1rem; color: var(--text); max-width: 800px; }
        .note-content h2 { margin-top: 2em; margin-bottom: 0.5em; font-size: 1.5rem; }
        .note-content p { margin-bottom: 1.2em; }
        .note-content ul { list-style: disc; padding-left: 20px; margin-bottom: 1.2em; }
        .note-content pre { background: #1e293b; color: #f8fafc; padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 1.5em; font-size: 0.9em; }
        .note-content blockquote { border-left: 4px solid var(--primary); padding-left: 16px; color: var(--text-light); margin-bottom: 1.5em; font-style: italic; }
        .note-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 1.5em 0; border: 1px solid var(--border); }

        /* Lock Overlay */
        .lock-overlay {
            position: absolute;
            top: 35%;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0.95));
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        /* Modal */
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px); z-index: 200;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-backdrop.open { opacity: 1; pointer-events: all; }
        .modal-content {
            background: white; width: 100%; max-width: 400px;
            border-radius: 16px; padding: 24px;
            box-shadow: var(--shadow-md);
            transform: translateY(20px); transition: 0.3s;
        }
        .modal-backdrop.open .modal-content { transform: translateY(0); }

        /* Loading & Empty */
        .loading { text-align: center; padding: 40px; color: var(--text-light); }
        .empty { text-align: center; padding: 40px; color: var(--text-light); }

        /* Setup Screen */
        #setup-screen {
            position: fixed; inset: 0; background: var(--dark); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        #setup-screen h1 { color: white; margin-bottom: 20px; }
        #setup-input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; margin-bottom: 10px; }
        #setup-input::placeholder { color: rgba(255,255,255,0.5); }

        @media (min-width: 768px) {
            .nav-links { display: flex; }
            .hero h1 { font-size: 3rem; }
            .hero p { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- SETUP SCREEN (Hidden if configured) -->
    <div id="setup-screen" class="hidden">
        <h1>Platform Setup</h1>
        <p style="margin-bottom: 20px; opacity: 0.8;">Enter your Supabase credentials to initialize.</p>
        <div style="width: 100%; max-width: 350px;">
            <input type="text" id="sb-url-input" class="input-field w-full" placeholder="Supabase URL">
            <input type="text" id="sb-key-input" class="input-field w-full" placeholder="Supabase Anon Key">
            <button onclick="saveConfig()" class="btn btn-primary w-full" style="margin-top: 10px;">Connect</button>
        </div>
    </div>

    <!-- MAIN APP STRUCTURE -->
    <div id="app-wrapper">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="container w-full flex justify-between items-center">
                <a href="#" onclick="router.navigate('home')" class="nav-logo">
                    <span>BCA</span>Hub
                </a>
                <div class="nav-links">
                    <div class="nav-link" onclick="router.navigate('home')">Home</div>
                    <div class="nav-link" onclick="openSearch()">Search</div>
                    <a href="admin.html" target="_blank" class="nav-link">Admin</a>
                </div>
                <button class="btn btn-primary btn-sm" onclick="router.navigate('home')">Get Notes</button>
            </div>
        </nav>

        <!-- Dynamic Content Area -->
        <main id="main-content" class="container" style="min-height: 80vh; padding-top: 24px;">
            <!-- Content injected by JS -->
        </main>

        <!-- Footer -->
        <footer style="background: var(--surface); padding: 40px 0; margin-top: 60px; border-top: 1px solid var(--border);">
            <div class="container text-center">
                <h2 style="font-size: 1.2rem; margin-bottom: 8px;">BCA Hub Premium</h2>
                <p style="color: var(--text-light); font-size: 0.9rem;">Complete BCA Notes, PYQs & Resources</p>
                <div style="margin-top: 16px; font-size: 0.85rem; color: var(--text-light);">
                    © 2025 BCA Hub. All rights reserved.
                </div>
            </div>
        </footer>
    </div>

    <!-- UNLOCK MODAL -->
    <div id="unlock-modal" class="modal-backdrop">
        <div class="modal-content">
            <div class="text-center">
                <div style="font-size: 2rem; margin-bottom: 10px;">🔓</div>
                <h3 style="margin-bottom: 8px;">Unlock Full Notes</h3>
                <p style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 20px;">
                    Get access to this complete unit and PDF downloads.
                </p>
            </div>
            <form onsubmit="handleUnlock(event)">
                <div class="input-group">
                    <label class="input-label">Full Name</label>
                    <input type="text" id="unlock-name" class="input-field" required placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label class="input-label">Mobile Number</label>
                    <input type="tel" id="unlock-mobile" class="input-field" required placeholder="98765xxxxx" pattern="[0-9]{10}">
                </div>
                <button type="submit" class="btn btn-primary w-full">Unlock Now</button>
            </form>
            <button class="btn btn-ghost w-full" style="margin-top: 10px; font-size: 0.85rem;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <!-- SEARCH OVERLAY (Simple implementation) -->
    <div id="search-overlay" class="modal-backdrop" onclick="if(event.target===this) closeSearch()">
        <div class="modal-content" style="max-width: 600px; padding: 16px;">
            <input type="text" id="search-input" class="input-field" placeholder="Search notes, units, subjects..." oninput="handleSearch(this.value)">
            <div id="search-results" style="margin-top: 16px; max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        // =========================================
        // CONFIG & STATE
        // =========================================
        const SUPABASE_URL = localStorage.getItem('sb_url');
        const SUPABASE_KEY = localStorage.getItem('sb_key');
        let supabase = null;
        let currentNoteId = null;
        let lang = 'en'; // 'en' or 'hi'

        // Initial Check
        if (SUPABASE_URL && SUPABASE_KEY) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            document.getElementById('setup-screen').classList.add('hidden');
            router.navigate('home');
        } else {
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        function saveConfig() {
            const url = document.getElementById('sb-url-input').value.trim();
            const key = document.getElementById('sb-key-input').value.trim();
            if(url && key) {
                localStorage.setItem('sb_url', url);
                localStorage.setItem('sb_key', key);
                location.reload();
            }
        }

        // =========================================
        // ROUTER & VIEWS
        // =========================================
        const router = {
            navigate: (view, param = null) => {
                const main = document.getElementById('main-content');
                main.innerHTML = '<div class="loading">Loading...</div>';
                window.scrollTo(0,0);

                if (view === 'home') renderHome(main);
                else if (view === 'semesters') renderSemesters(main);
                else if (view === 'subjects') renderSubjects(main, param);
                else if (view === 'units') renderUnits(main, param);
                else if (view === 'note') renderNote(main, param);
            }
        };

        // =========================================
        // DATA FETCHING
        // =========================================
        async function fetchTable(table, column = '*', filter = null) {
            let query = supabase.from(table).select(column);
            if (filter) query = query.eq(filter.col, filter.val);
            const { data, error } = await query;
            if (error) { console.error(error); return []; }
            return data;
        }

        // =========================================
        // VIEW RENDERERS
        // =========================================
        async function renderHome(container) {
            // Hero Section
            container.innerHTML = `
                <section class="hero fade-in">
                    <span class="badge active" style="margin-bottom: 16px;">New 2025 Batch</span>
                    <h1>Your Complete BCA<br>Learning Platform</h1>
                    <p>Notes • PYQs • Important Questions • Quizzes</p>
                    <div class="flex justify-center gap-4">
                        <button onclick="router.navigate('semesters')" class="btn btn-primary">Start Learning</button>
                        <button onclick="openSearch()" class="btn" style="border:1px solid var(--border)">Browse Notes</button>
                    </div>
                </section>
                
                <section style="margin-top: 40px;">
                    <div class="flex justify-between items-center" style="margin-bottom: 20px;">
                        <h3>Select Semester</h3>
                    </div>
                    <div id="semester-grid" class="grid">
                        <div class="loading">Loading Semesters...</div>
                    </div>
                </section>
            `;

            const sems = await fetchTable('semesters');
            const grid = document.getElementById('semester-grid');
            
            if (sems.length === 0) {
                grid.innerHTML = `<div class="empty">No semesters found. Add them in Admin.</div>`;
                return;
            }

            grid.innerHTML = sems.map(sem => `
                <div class="card" onclick="router.navigate('subjects', ${sem.id})">
                    <div style="font-size: 2rem; opacity: 0.1; position: absolute; top: 10px; right: 10px; font-weight: 800;">${sem.id}</div>
                    <h3 style="margin-bottom: 8px;">${sem.name}</h3>
                    <p style="color: var(--text-light); font-size: 0.9rem;">Subjects, Notes & PYQs</p>
                    <div style="margin-top: 16px; display: flex; gap: 8px;">
                         <span class="badge">Full Access</span>
                    </div>
                </div>
            `).join('');
        }

        async function renderSubjects(container, semId) {
            const sems = await fetchTable('semesters');
            const currentSem = sems.find(s => s.id == semId);
            const subjects = await fetchTable('subjects', '*', {col: 'semester_id', val: semId});

            container.innerHTML = `
                <div class="breadcrumbs">
                    <div class="crumb" onclick="router.navigate('home')">Home</div>
                    <span>/</span>
                    <div class="crumb">${currentSem ? currentSem.name : 'Semester'}</div>
                </div>
                <h2 style="margin-bottom: 24px;">${currentSem ? currentSem.name : ''} Subjects</h2>
                <div class="grid">
                    ${subjects.length ? subjects.map(sub => `
                        <div class="card" onclick="router.navigate('units', ${sub.id})">
                            <h4 style="margin-bottom: 8px;">${sub.name}</h4>
                            <div class="flex gap-2">
                                <span class="badge">Notes</span>
                                <span class="badge">PYQs</span>
                            </div>
                        </div>
                    `).join('') : '<div class="empty">No subjects found.</div>'}
                </div>
            `;
        }

        async function renderUnits(container, subId) {
            // To get proper breadcrumb, we'd need to fetch semester info via join or multiple calls. 
            // Keeping it simple for Vanilla JS:
            const units = await fetchTable('units', '*', {col: 'subject_id', val: subId});
            
            container.innerHTML = `
                <div class="breadcrumbs">
                    <div class="crumb" onclick="router.navigate('home')">Home</div>
                    <span>/</span>
                    <div class="crumb" onclick="history.back()">Subjects</div>
                </div>
                <h2 style="margin-bottom: 24px;">Units</h2>
                <div class="flex flex-col gap-4">
                    ${units.length ? units.map(unit => `
                        <div class="card flex justify-between items-center">
                            <div>
                                <h4 style="margin-bottom: 4px;">${unit.name}</h4>
                                <p style="font-size: 0.85rem; color: var(--text-light);">Complete theory & problems</p>
                            </div>
                            <button onclick="loadFirstNote(${unit.id})" class="btn btn-primary btn-sm">Read</button>
                        </div>
                    `).join('') : '<div class="empty">No units found.</div>'}
                </div>
            `;
        }

        async function loadFirstNote(unitId) {
            const notes = await fetchTable('notes', 'id', {col: 'unit_id', val: unitId});
            if(notes.length > 0) router.navigate('note', notes[0].id);
            else alert('No notes added for this unit yet.');
        }

        async function renderNote(container, noteId) {
            currentNoteId = noteId;
            const { data: note } = await supabase.from('notes').select('*, units!inner(subject_id), subjects!inner(semester_id)').eq('id', noteId).single();
            
            if (!note) { container.innerHTML = '<div class="empty">Note not found</div>'; return; }

            // Language Toggle
            const content = lang === 'en' ? note.english_content : note.hindi_content;
            const isUnlocked = localStorage.getItem(`unlocked_${noteId}`) === 'true';

            container.innerHTML = `
                <div class="breadcrumbs">
                    <div class="crumb" onclick="router.navigate('home')">Home</div>
                    <span>/</span>
                    <div class="crumb" onclick="router.navigate('subjects', ${note.subjects.semester_id})">Sem</div>
                    <span>/</span>
                    <div class="crumb" onclick="router.navigate('units', ${note.units.subject_id})">Units</div>
                </div>

                <div class="reader-container" style="margin-top: 24px;">
                    <!-- Sidebar (Hidden on mobile usually, but sticky here) -->
                    <aside class="toc-sticky hidden-mobile">
                        <div style="font-weight: 600; margin-bottom: 12px;">In this Unit</div>
                        <div class="toc-list">
                            <!-- Dynamic TOC could be generated here -->
                            <div class="toc-item">Introduction</div>
                            <div class="toc-item">Key Concepts</div>
                            <div class="toc-item">Summary</div>
                        </div>
                        <div style="margin-top: 24px;">
                             <button onclick="toggleLang()" class="btn btn-sm btn-ghost w-full">
                                ${lang === 'en' ? 'Switch to Hindi' : 'Switch to English'}
                             </button>
                        </div>
                    </aside>

                    <!-- Content -->
                    <article style="position: relative;">
                        <div class="flex justify-between items-center" style="margin-bottom: 20px;">
                            <h1 style="font-size: 1.8rem;">${note.title}</h1>
                            <button onclick="toggleLang()" class="btn btn-sm btn-ghost md-hidden">
                                ${lang === 'en' ? 'HI' : 'EN'}
                            </button>
                        </div>
                        
                        <div id="note-body" class="note-content">
                            ${content}
                        </div>

                        ${!isUnlocked ? `
                            <div class="lock-overlay">
                                <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: var(--shadow-md); max-width: 300px;">
                                    <h3 style="margin-bottom: 10px;">Premium Content</h3>
                                    <p style="font-size: 0.9rem; margin-bottom: 20px; color: var(--text-light);">This note is locked. Enter details to continue reading.</p>
                                    <button onclick="openUnlockModal()" class="btn btn-primary w-full">Unlock Now</button>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${note.pdf_url ? `
                            <div style="margin-top: 40px; padding: 20px; background: var(--surface); border-radius: 8px; text-align: center;">
                                <p style="margin-bottom: 10px; font-weight: 500;">Download PDF</p>
                                <a href="${note.pdf_url}" target="_blank" class="btn btn-primary btn-sm">Download PDF</a>
                            </div>
                        ` : ''}

                    </article>
                </div>
            `;
        }

        // =========================================
        // INTERACTIONS
        // =========================================
        function toggleLang() {
            lang = lang === 'en' ? 'hi' : 'en';
            if(currentNoteId) router.navigate('note', currentNoteId);
        }

        function openUnlockModal() {
            document.getElementById('unlock-modal').classList.add('open');
        }
        function closeModal() {
            document.querySelectorAll('.modal-backdrop').forEach(el => el.classList.remove('open'));
        }

        async function handleUnlock(e) {
            e.preventDefault();
            const name = document.getElementById('unlock-name').value;
            const mobile = document.getElementById('unlock-mobile').value;

            // Save to Supabase
            const { error } = await supabase.from('leads').insert([{ name, mobile }]);

            if (error) {
                alert('Error saving details. Please try again.');
            } else {
                // Unlock locally
                localStorage.setItem(`unlocked_${currentNoteId}`, 'true');
                closeModal();
                // Refresh note view
                router.navigate('note', currentNoteId);
            }
        }

        function openSearch() {
            document.getElementById('search-overlay').classList.add('open');
            document.getElementById('search-input').focus();
        }
        function closeSearch() {
            document.getElementById('search-overlay').classList.remove('open');
        }

        async function handleSearch(query) {
            const resultsDiv = document.getElementById('search-results');
            if(query.length < 3) {
                resultsDiv.innerHTML = '<p class="text-center" style="color:var(--text-light)">Type at least 3 characters...</p>';
                return;
            }
            
            // Search in Notes and Units
            const [notesRes, unitsRes] = await Promise.all([
                supabase.from('notes').select('id, title, units!inner(name)').ilike('title', `%${query}%`),
                supabase.from('units').select('id, name, subjects!inner(name)').ilike('name', `%${query}%`)
            ]);

            let html = '';
            
            if(notesRes.data) {
                notesRes.data.forEach(n => {
                    html += `
                        <div class="card" style="margin-bottom: 8px; padding: 12px; cursor: pointer;" onclick="closeSearch(); router.navigate('note', ${n.id})">
                            <div style="font-size: 0.85rem; color: var(--primary);">Note</div>
                            <div style="font-weight: 500;">${n.title}</div>
                        </div>
                    `;
                });
            }
            if(unitsRes.data) {
                unitsRes.data.forEach(u => {
                    html += `
                        <div class="card" style="margin-bottom: 8px; padding: 12px; cursor: pointer;" onclick="closeSearch(); loadFirstNote(${u.id})">
                            <div style="font-size: 0.85rem; color: var(--primary);">Unit</div>
                            <div style="font-weight: 500;">${u.name}</div>
                        </div>
                    `;
                });
            }

            resultsDiv.innerHTML = html || '<div class="text-center">No results found.</div>';
        }

        // Mobile responsive style injection for specific elements
        const style = document.createElement('style');
        style.innerHTML = `
            @media (max-width: 768px) {
                .hidden-mobile { display: none; }
                .md-hidden { display: inline-flex; }
            }
            @media (min-width: 769px) {
                .md-hidden { display: none; }
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
